<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin · The Lady Cornelia Foundation</title>
<link rel="icon" href="assets/logo-light.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<script src="/api/config"></script>
</head>
<body>
<section id="login" class="login" hidden>
 <form id="lf" class="login-card">
  <img src="assets/logo-light.png" alt="" width="110">
  <h1>Admin sign in</h1>
  <label>Email<input id="le" type="email" autocomplete="username" required></label>
  <label>Password<input id="lp" type="password" autocomplete="current-password" required></label>
  <p class="err" id="lerr"></p>
  <button class="btn" type="submit">Sign in</button>
  <button class="linkbtn" type="button" id="forgot">Forgot password?</button>
 </form>
</section>

<div id="app" class="app" hidden>
 <aside>
  <img src="assets/logo-light.png" alt="The Lady Cornelia Foundation" class="logo">
  <nav id="nav"></nav>
  <div class="side-foot"><a href="index.html" target="_blank" rel="noopener">View website ↗</a><button class="linkbtn" id="out">Sign out</button><small id="who"></small></div>
 </aside>
 <main><header class="top"><button class="menu" id="menu" aria-label="Menu">☰</button><h1 id="title"></h1><div id="actions"></div></header><div id="view"></div></main>
</div>

<dialog id="modal"><form id="mf" method="dialog"><h2 id="mt"></h2><div id="mb"></div><p class="err" id="merr"></p><div class="mact"><button type="button" class="btn ghost" id="mc">Cancel</button><button class="btn" id="ms" type="submit">Save</button></div></form></dialog>
<div id="toast" role="status"></div>
<script type="module" src="js/admin.js"></script>
</body>
</html>
